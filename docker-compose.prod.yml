# CisBanka на сервере: готовый образ из GHCR, без сборки на VPS.
# Удобнее всего: COMPOSE_FILE=docker-compose.prod.yml в .env — тогда просто docker compose pull && docker compose up -d
# Только приложение (80/443 заняты другим прокси): docker compose up -d app  (слушает 127.0.0.1:${APP_PORT:-3000})
# Конкретная версия вместо latest:  CISBANKA_TAG=sha-abc1234 в .env
services:
  app:
    image: ghcr.io/banochka01/cisbanka:${CISBANKA_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DB_PATH: /data/cisbanka.db
    volumes:
      - cisbanka-data:/data
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    # VPS делим с другими сервисами: потолок памяти и ротация логов
    mem_limit: ${APP_MEM_LIMIT:-512m}
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    mem_limit: 128m
    logging: *logging
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  cisbanka-data:
  caddy-data:
  caddy-config:
