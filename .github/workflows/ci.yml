name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Настоящий Wireshark для проверки экспорта .pcap (свежий из PPA, иначе — из Ubuntu).
      - name: Установка tshark
        run: |
          sudo add-apt-repository -y ppa:wireshark-dev/stable || echo "PPA недоступен — ставлю tshark из Ubuntu"
          sudo apt-get update -q
          echo "wireshark-common wireshark-common/install-setuid boolean false" | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends tshark
          tshark --version | head -1
      - run: npm test
        env:
          REQUIRE_TSHARK: '1'
      # Отдельно и с аннотациями: расхождения с Wireshark видны прямо в сводке прогона.
      - name: .pcap глазами Wireshark (tshark -V, контрольные суммы, колонки)
        working-directory: engine
        env:
          REQUIRE_TSHARK: '1'
        run: npx vitest run test/tshark.test.ts --reporter=default --reporter=github-actions
      # Анализатор грузится лениво — основной чанк должен оставаться меньше 500 КБ (без предупреждения Vite).
      - name: Сборка
        run: |
          npm run build 2>&1 | tee build.log; test "${PIPESTATUS[0]}" = 0
          if grep -q "larger than 500" build.log; then echo "::error title=Бандл::основной чанк больше 500 КБ"; exit 1; fi

  # Чистая машина: docker compose up -d --build с нуля, ждём healthcheck, проверяем HTTPS через Caddy и бэкап.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: .env
        run: |
          cp .env.example .env
          sed -i "s/^DOMAIN=.*/DOMAIN=localhost/" .env
          sed -i "s/^JWT_SECRET=.*/JWT_SECRET=$(openssl rand -hex 32)/" .env
          sed -i "s/^ADMIN_INVITE_CODE=.*/ADMIN_INVITE_CODE=ci-invite-code/" .env
      - name: docker compose up -d --build
        run: docker compose up -d --build 2>&1 | tee up.log; exit ${PIPESTATUS[0]}
      - name: Ждём healthy
        run: |
          for i in $(seq 1 40); do
            s=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q app)")
            echo "app: $s"; [ "$s" = healthy ] && exit 0; sleep 3
          done
          docker compose logs; exit 1
      - name: Smoke-тест через Caddy (HTTPS) и напрямую
        run: |
          sleep 5
          curl -fsS http://127.0.0.1:3000/api/health
          curl -fsSk https://localhost/api/health
          curl -fsSk https://localhost/ | grep -q 'CisBanka'
          curl -fsSk https://localhost/s/some-token | grep -q 'CisBanka'
          code=$(curl -sk -o /dev/null -w '%{http_code}' -X POST https://localhost/api/auth/teacher/register -H 'Content-Type: application/json' -d '{"invite":"wrong","login":"t1","password":"password1"}')
          [ "$code" = 403 ]
          curl -fsSk -c jar -X POST https://localhost/api/auth/teacher/register -H 'Content-Type: application/json' \
            -d '{"invite":"ci-invite-code","login":"teacher","password":"password1","name":"Учитель"}'
          curl -fsSk -b jar -X POST https://localhost/api/classes -H 'Content-Type: application/json' -d '{"name":"9А"}'
      - name: Бэкап
        run: |
          ./scripts/backup.sh 2>&1 | tee backup.log; test "${PIPESTATUS[0]}" = 0
          ls -la backups
          test "$(ls backups/cisbanka-*.db | wc -l)" -ge 1
      - name: Перезапуск сохраняет данные
        run: |
          docker compose down
          docker compose up -d
          for i in $(seq 1 40); do
            s=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q app)"); [ "$s" = healthy ] && break; sleep 3
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3000/api/auth/teacher/login -H 'Content-Type: application/json' -d '{"login":"teacher","password":"password1"}')
          [ "$code" = 200 ]
      - name: Логи при ошибке
        if: failure()
        run: |
          docker compose ps -a || true
          docker compose logs --no-color > compose.log 2>&1 || true
          # хвосты логов — в аннотации (их видно без входа в GitHub)
          for f in up.log backup.log compose.log; do
            [ -s "$f" ] && echo "::error title=$f::$(tail -n 60 "$f" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          done
          true

  # Готовый образ в GHCR: ghcr.io/banochka01/cisbanka:latest и :sha-<коммит>. Только после зелёных тестов на main.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/banochka01/cisbanka
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: short
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Версия в /api/health — по ней автодеплой проверяет, что выкатился именно этот образ.
          build-args: CISBANKA_VERSION=sha-${{ steps.short.outputs.sha }}
      - name: Проверка docker-compose.prod.yml на опубликованном образе (как на VPS)
        run: |
          {
            echo "COMPOSE_FILE=docker-compose.prod.yml"
            echo "CISBANKA_TAG=sha-${GITHUB_SHA::7}"
            echo "DOMAIN=localhost"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "ADMIN_INVITE_CODE=ci-invite-code"
          } > .env
          # проверка сервера: на чистой машине порты свободны, образ доступен → код 0
          ./scripts/check-vps.sh
          docker compose pull
          docker compose up -d
          for i in $(seq 1 40); do
            s=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q app)"); echo "app: $s"
            [ "$s" = healthy ] && break; sleep 3
          done
          sleep 3
          curl -fsSk https://localhost/api/health | tee health.json
          grep -q "\"version\":\"sha-${GITHUB_SHA::7}\"" health.json
          ./scripts/backup.sh
          docker compose images
          # повторно: 80/443 заняты нашим Caddy — это не ошибка
          ./scripts/check-vps.sh
          ./scripts/check-vps.sh --behind-proxy
      - name: scripts/deploy.sh так, как его вызывает автодеплой по SSH
        run: |
          # чужие команды отклоняются, ничего не выполнив
          for bad in "rm -rf /" "deploy main" "deploy $GITHUB_SHA; id" ""; do
            if SSH_ORIGINAL_COMMAND="$bad" ./scripts/deploy.sh; then echo "::error::принята команда «$bad»"; exit 1; fi
          done
          if SSH_ORIGINAL_COMMAND="deploy 0000000000000000000000000000000000000000" ./scripts/deploy.sh; then exit 1; fi
          SSH_ORIGINAL_COMMAND="deploy $GITHUB_SHA" ./scripts/deploy.sh
          SSH_ORIGINAL_COMMAND="status" ./scripts/deploy.sh
          test "$(cat .deploy-tag)" = "sha-${GITHUB_SHA::7}"

  # Автодеплой на VPS после публикации образа. Пока секреты VPS_* не заданы — пропускается (с пометкой в сводке).
  # Ключ на сервере ограничен command="…/scripts/deploy.sh" — см. README, раздел «Автодеплой».
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.CISBANKA_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      VPS_PORT: ${{ vars.VPS_PORT || '22' }}
      CISBANKA_URL: ${{ vars.CISBANKA_URL }}
    steps:
      - id: cfg
        name: Секреты заданы?
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "::notice title=Автодеплой выключен::Задайте секреты VPS_HOST, VPS_USER, VPS_SSH_KEY (README → «Автодеплой»)"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: SSH-ключ и ключ сервера
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning title=VPS_KNOWN_HOSTS не задан::ключ сервера принят без проверки (ssh-keyscan) — задайте секрет, чтобы исключить подмену сервера"
            ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
      - name: Деплой sha-${{ github.sha }}
        if: steps.cfg.outputs.enabled == 'true'
        # Команду сервер всё равно заменит на deploy.sh; сюда передаётся только «deploy <sha>», скрипт её проверяет.
        run: |
          ssh -i ~/.ssh/deploy -p "$VPS_PORT" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 "$VPS_USER@$VPS_HOST" "deploy $GITHUB_SHA"
      - name: Health-check снаружи (через домен)
        if: steps.cfg.outputs.enabled == 'true' && vars.CISBANKA_URL != ''
        run: |
          want="sha-${GITHUB_SHA::7}"
          for i in $(seq 1 20); do
            body=$(curl -fsS --max-time 10 "${CISBANKA_URL%/}/api/health" || true)
            echo "$body"
            case "$body" in *"\"version\":\"$want\""*) exit 0 ;; esac
            sleep 6
          done
          echo "::error title=Health-check::${CISBANKA_URL} не отвечает версией $want"
          exit 1
